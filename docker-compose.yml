# ============================================================
# GymCoach - Compose DEV
# ============================================================
# Starts ONLY Postgres. Next.js runs locally through `npm run dev` for native
# hot reload.
#
# To self-host (everything in Docker): see docker-compose.selfhost.yml.

services:
  db:
    image: postgres:16-alpine
    container_name: gymcoach-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gymcoach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymcoach_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-gymcoach}
    ports:
      # Host port 5433 avoids clashing with a system Postgres or another
      # project already on 5432. Inside the container it stays 5432.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gymcoach} -d ${POSTGRES_DB:-gymcoach}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
